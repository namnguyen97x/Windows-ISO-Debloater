name: Windows ISO Debloater

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Chọn phiên bản Windows'
        required: true
        type: choice
        options:
          - 'Windows 11'
          - 'Windows 10'
          - 'Custom (Full Options)'
        default: 'Windows 11'
      windows_build:
        description: 'Chọn build Windows (chỉ áp dụng cho Windows 11)'
        required: false
        type: choice
        options:
          - '25H2 (Latest)'
          - '24H2'
        default: '25H2 (Latest)'
      windows_edition:
        description: 'Chọn phiên bản Windows'
        required: true
        type: choice
        options:
          - 'Pro'
          - 'Home'
          - 'Enterprise'
        default: 'Pro'
      iso_url:
        description: 'URL của Windows ISO (để trống nếu dùng preset). Lấy từ: https://www.microsoft.com/en-us/software-download/windows11'
        required: false
        type: string
      iso_filename:
        description: 'Tên file ISO (không có extension)'
        required: true
        type: string
        default: 'Windows_Debloated'
      custom_options:
        description: 'Tùy chọn tùy chỉnh (chỉ dùng với Custom mode)'
        required: false
        type: string
        default: 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true'
  schedule:
    # Chạy tự động mỗi thứ 2 lúc 2:00 AM UTC (9:00 AM VN)
    - cron: '0 2 * * 1'

env:
  ISO_DOWNLOAD_PATH: ${{ github.workspace }}/downloads
  OUTPUT_PATH: ${{ github.workspace }}/output

jobs:
  debloat-windows-iso:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create directories
      run: |
        New-Item -ItemType Directory -Path "$env:ISO_DOWNLOAD_PATH" -Force
        New-Item -ItemType Directory -Path "$env:OUTPUT_PATH" -Force
        
    - name: Setup ISO URL and Configuration
      run: |
        $windowsVersion = "${{ github.event.inputs.windows_version }}"
        $windowsBuild = "${{ github.event.inputs.windows_build }}"
        $windowsEdition = "${{ github.event.inputs.windows_edition }}"
        $customUrl = "${{ github.event.inputs.iso_url }}"
        
        # Xác định URL ISO dựa trên menu selection
        if ($windowsVersion -eq "Custom (Full Options)") {
          # Custom mode - sử dụng URL từ input hoặc default
          $isoUrl = if ($customUrl) { $customUrl } else { "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d" }
          $winEdition = "${{ github.event.inputs.windows_edition }}"
        } else {
          # Quick preset mode - xây dựng từ menu selections
          $winEdition = "$windowsVersion $windowsEdition"
          
          if ($windowsVersion -eq "Windows 11") {
            if ($windowsBuild -eq "25H2 (Latest)") {
              $isoUrl = "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d"
            } else {
              # 24H2 fallback
              $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso"
            }
          } elseif ($windowsVersion -eq "Windows 10") {
            $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win10_22H2_English_x64v1.iso"
          }
        }
        
        # Lưu vào environment variables
        echo "ISO_URL=$isoUrl" >> $env:GITHUB_ENV
        echo "WIN_EDITION=$winEdition" >> $env:GITHUB_ENV
        
        Write-Host "Using preset: $preset"
        Write-Host "ISO URL: $isoUrl"
        Write-Host "Windows Edition: $winEdition"
        
    - name: Download Windows ISO
      run: |
        $isoUrl = $env:ISO_URL
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        Write-Host "Downloading Windows ISO from: $isoUrl"
        
        # Fallback URLs nếu URL chính fail - sử dụng URLs hoạt động
        $fallbackUrls = @(
          "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d",
          "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://software-download.microsoft.com/download/sg/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
        )
        
        $downloadSuccess = $false
        $ProgressPreference = 'SilentlyContinue'
        
        # Thử download từ URL chính trước với progress tracking
        try {
          Write-Host "Attempting download from primary URL..."
          Write-Host "URL: $isoUrl"
          
          # Sử dụng WebClient để có progress tracking
          $webClient = New-Object System.Net.WebClient
          $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
          
          # Tạo event handler cho progress với proper event registration
          $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
            $percent = $Event.SourceEventArgs.ProgressPercentage
            $bytesReceived = $Event.SourceEventArgs.BytesReceived
            $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
            
            if ($totalBytes -gt 0) {
              $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
              $totalMB = [math]::Round($totalBytes / 1MB, 2)
              Write-Host "Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
            }
          }
          
          # Bắt đầu download
          Write-Host "Starting download with progress tracking..."
          $webClient.DownloadFile($isoUrl, $isoPath)
          
          # Cleanup
          $webClient.Dispose()
          if ($eventJob) {
            Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
            Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
          }
          
          # Kiểm tra file size
          $fileSize = (Get-Item $isoPath).Length
          $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
          Write-Host "Download completed! File size: $fileSizeGB GB"
          
          if ($fileSize -gt 1GB) {
            $downloadSuccess = $true
            Write-Host "✅ Download successful from primary URL"
          } else {
            Write-Warning "Downloaded file is too small, trying fallback URLs..."
            Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
          }
        }
        catch {
          Write-Warning "Primary URL failed: $($_.Exception.Message)"
          Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
        }
        
        # Thử fallback URLs nếu primary URL fail
        if (-not $downloadSuccess) {
          foreach ($fallbackUrl in $fallbackUrls) {
            try {
              Write-Host "Trying fallback URL: $fallbackUrl"
              
              # Sử dụng WebClient cho fallback URLs cũng
              $webClient = New-Object System.Net.WebClient
              $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
              
              # Event handler cho progress với proper event registration
              $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
                $percent = $Event.SourceEventArgs.ProgressPercentage
                $bytesReceived = $Event.SourceEventArgs.BytesReceived
                $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
                
                if ($totalBytes -gt 0) {
                  $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
                  $totalMB = [math]::Round($totalBytes / 1MB, 2)
                  Write-Host "Fallback Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
                }
              }
              
              Write-Host "Starting fallback download with progress tracking..."
              $webClient.DownloadFile($fallbackUrl, $isoPath)
              
              # Cleanup
              $webClient.Dispose()
              if ($eventJob) {
                Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
                Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
              }
              
              $fileSize = (Get-Item $isoPath).Length
              $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
              Write-Host "Fallback download completed! File size: $fileSizeGB GB"
              
              if ($fileSize -gt 1GB) {
                $downloadSuccess = $true
                Write-Host "✅ Download successful from fallback URL"
                break
              } else {
                Write-Warning "Fallback file too small, trying next..."
                Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              }
            }
            catch {
              Write-Warning "Fallback URL failed: $($_.Exception.Message)"
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            }
          }
        }
        
        # Nếu tất cả WebClient attempts fail, thử Invoke-WebRequest đơn giản
        if (-not $downloadSuccess) {
          Write-Host "WebClient downloads failed, trying simple download method..."
          try {
            Write-Host "Attempting simple download from primary URL..."
            Invoke-WebRequest -Uri $isoUrl -OutFile $isoPath -UseBasicParsing -TimeoutSec 600
            
            $fileSize = (Get-Item $isoPath).Length
            $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
            Write-Host "Simple download completed! File size: $fileSizeGB GB"
            
            if ($fileSize -gt 1GB) {
              $downloadSuccess = $true
              Write-Host "✅ Download successful with simple method"
            }
          }
          catch {
            Write-Warning "Simple download also failed: $($_.Exception.Message)"
          }
        }
        
        if (-not $downloadSuccess) {
          Write-Error "All download attempts failed. Please provide a custom ISO URL in the workflow inputs."
          Write-Host "You can get Windows ISO from: https://www.microsoft.com/en-us/software-download/windows11"
          Write-Host "Or try using a different ISO URL in the 'iso_url' input field."
          exit 1
        }
        
        $ProgressPreference = 'Continue'
        
    - name: Verify ISO file
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        if (-not (Test-Path $isoPath)) {
          Write-Error "ISO file not found at: $isoPath"
          exit 1
        }
        
        # Kiểm tra file có phải ISO hợp lệ không
        try {
          $mountResult = Mount-DiskImage -ImagePath $isoPath -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          $mountPath = "${driveLetter}:\"
          
          # Kiểm tra các file cần thiết
          $requiredFiles = @("sources\install.wim", "sources\install.esd", "bootmgr", "bootmgr.efi")
          $missingFiles = @()
          
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $mountPath $file))) {
              $missingFiles += $file
            }
          }
          
          # Unmount
          Dismount-DiskImage -ImagePath $isoPath
          
          if ($missingFiles.Count -gt 0) {
            Write-Warning "Missing required files: $($missingFiles -join ', ')"
            Write-Host "This might be a valid ISO but missing some expected files"
          } else {
            Write-Host "ISO verification successful - all required files found"
          }
        }
        catch {
          Write-Error "Failed to verify ISO: $_"
          exit 1
        }
        
    - name: Run Windows ISO Debloater
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        $outputISO = "${{ github.event.inputs.iso_filename }}"
        $winEdition = $env:WIN_EDITION
        $windowsVersion = "${{ github.event.inputs.windows_version }}"
        
        # Chuẩn bị parameters cơ bản
        $params = @(
          "-noPrompt"
          "-isoPath", "`"$isoPath`""
          "-winEdition", "`"$winEdition`""
          "-outputISO", "`"$outputISO`""
        )
        
        # Xử lý preset hoặc custom options
        if ($windowsVersion -ne "Custom (Full Options)") {
          # Quick preset mode - tối ưu cho tất cả Windows versions
          $params += @(
            "-AppxRemove", "no"
            "-CapabilitiesRemove", "yes"
            "-OnedriveRemove", "yes"
            "-EDGERemove", "no"
            "-AIRemove", "no"
            "-TPMBypass", "yes"
            "-UserFoldersEnable", "yes"
            "-ESDConvert", "yes"
            "-useOscdimg", "yes"
          )
          Write-Host "Using Quick preset configuration for $windowsVersion (minimal debloat, keeping Edge, Store, AI, Defender)"
        } else {
          # Custom options - parse custom_options string
          $customOptions = "${{ github.event.inputs.custom_options }}"
          Write-Host "Custom options: $customOptions"
          
          # Parse options (format: edge:false,store:false,ai:false,defender:false,tpm:true,compress:true)
          $options = @{}
          $customOptions -split ',' | ForEach-Object {
            $parts = $_ -split ':'
            if ($parts.Length -eq 2) {
              $options[$parts[0]] = $parts[1]
            }
          }
          
          # Set default values if not specified
          $edgeRemove = if ($options['edge'] -eq 'true') { "yes" } else { "no" }
          $storeRemove = if ($options['store'] -eq 'true') { "yes" } else { "no" }
          $aiRemove = if ($options['ai'] -eq 'true') { "yes" } else { "no" }
          $defenderRemove = if ($options['defender'] -eq 'true') { "yes" } else { "no" }
          $tpmBypass = if ($options['tpm'] -eq 'true') { "yes" } else { "no" }
          $esdConvert = if ($options['compress'] -eq 'true') { "yes" } else { "no" }
          
          $params += @(
            "-AppxRemove", $storeRemove
            "-CapabilitiesRemove", "yes"
            "-OnedriveRemove", "yes"
            "-EDGERemove", $edgeRemove
            "-AIRemove", $aiRemove
            "-TPMBypass", $tpmBypass
            "-UserFoldersEnable", "yes"
            "-ESDConvert", $esdConvert
            "-useOscdimg", "yes"
          )
          Write-Host "Using custom configuration with parsed options"
        }
        
        Write-Host "Running Windows ISO Debloater..."
        Write-Host "Parameters: $($params -join ' ')"
        
        # Chạy script
        try {
          & ".\isoDebloaterScript.ps1" @params
          
          if ($LASTEXITCODE -ne 0) {
            throw "Script exited with code: $LASTEXITCODE"
          }
          
          Write-Host "Windows ISO Debloater completed successfully"
        }
        catch {
          Write-Error "Failed to run Windows ISO Debloater: $_"
          exit 1
        }
        
    - name: Check output ISO
      run: |
        $outputISO = "${{ github.event.inputs.iso_filename }}.iso"
        $outputPath = ".\$outputISO"
        
        if (-not (Test-Path $outputPath)) {
          Write-Error "Output ISO not found at: $outputPath"
          exit 1
        }
        
        $fileSize = (Get-Item $outputPath).Length
        $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
        Write-Host "Output ISO size: $fileSizeGB GB"
        
        # Di chuyển file đến output directory
        Move-Item $outputPath "$env:OUTPUT_PATH\$outputISO"
        Write-Host "Output ISO ready at: $env:OUTPUT_PATH\$outputISO"
        
    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debloated-windows-iso
        path: ${{ env.OUTPUT_PATH }}/*.iso
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: debloated-${{ github.run_number }}
        name: Windows ISO Debloated - ${{ github.run_number }}
        body: |
          ## 🚀 Windows ISO đã được xử lý tự động
          
          **📋 Thông tin:**
          - **Windows Version:** ${{ github.event.inputs.windows_version }}
          - **Windows Build:** ${{ github.event.inputs.windows_build }}
          - **Windows Edition:** ${{ github.event.inputs.windows_edition }}
          - **Tên file:** ${{ github.event.inputs.iso_filename }}.iso
          - **ISO gốc:** ${{ github.event.inputs.iso_url || 'Preset URL' }}
          
          **⚙️ Cấu hình xử lý:**
          - Xóa Microsoft Store: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '❌ (Quick preset - giữ lại)' }}
          - Xóa Windows features: ✅
          - Xóa OneDrive: ✅
          - Xóa Microsoft Edge: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '❌ (Quick preset - giữ lại)' }}
          - Xóa AI Components: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '❌ (Quick preset - giữ lại)' }}
          - Xóa Windows Defender: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '❌ (Quick preset - giữ lại)' }}
          - Bypass TPM: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '✅ (Quick preset - for better compatibility)' }}
          - Bật user folders: ✅
          - Nén ISO: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Tùy chỉnh' || '✅ (Quick preset - for smaller file size)' }}
          
          **⚠️ Lưu ý:** File này được tạo tự động bởi GitHub Actions. Vui lòng kiểm tra kỹ trước khi sử dụng.
          
          **🔗 Hướng dẫn:** Xem [README.md](README.md) để biết cách sử dụng.
        files: ${{ env.OUTPUT_PATH }}/*.iso
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Cleanup
      if: always()
      run: |
        Write-Host "Cleaning up temporary files..."
        
        # Xóa download directory
        if (Test-Path $env:ISO_DOWNLOAD_PATH) {
          Remove-Item -Path $env:ISO_DOWNLOAD_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa output directory
        if (Test-Path $env:OUTPUT_PATH) {
          Remove-Item -Path $env:OUTPUT_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa các file tạm thời khác
        if (Test-Path ".\*.iso") {
          Remove-Item -Path ".\*.iso" -Force -ErrorAction SilentlyContinue
        }
        
        Write-Host "Cleanup completed"
