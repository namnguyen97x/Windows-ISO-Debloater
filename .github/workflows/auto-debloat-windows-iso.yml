name: Windows ISO Debloater

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Chọn preset hoặc tùy chỉnh'
        required: true
        type: choice
        options:
          - 'Windows 11 Pro (Quick)'
          - 'Windows 11 Home (Quick)'
          - 'Windows 10 Pro (Quick)'
          - 'Windows 10 Home (Quick)'
          - 'Custom (Full Options)'
        default: 'Windows 11 Pro (Quick)'
      iso_url:
        description: 'URL của Windows ISO (để trống nếu dùng preset). Lấy từ: https://www.microsoft.com/en-us/software-download/windows11'
        required: false
        type: string
      iso_filename:
        description: 'Tên file ISO (không có extension)'
        required: true
        type: string
        default: 'Windows_Debloated'
      win_edition:
        description: 'Phiên bản Windows cần xử lý'
        required: true
        type: choice
        options:
          - 'Windows 11 Pro'
          - 'Windows 11 Home'
          - 'Windows 11 Enterprise'
          - 'Windows 10 Pro'
          - 'Windows 10 Home'
          - 'Windows 10 Enterprise'
        default: 'Windows 11 Pro'
      remove_edge:
        description: 'Xóa Microsoft Edge'
        required: false
        type: boolean
        default: false
      remove_msstore:
        description: 'Xóa Microsoft Store'
        required: false
        type: boolean
        default: false
      remove_ai:
        description: 'Xóa AI Components'
        required: false
        type: boolean
        default: false
      remove_defender:
        description: 'Xóa Windows Defender'
        required: false
        type: boolean
        default: false
      bypass_tpm:
        description: 'Bypass TPM check'
        required: false
        type: boolean
        default: true
      compress_iso:
        description: 'Nén ISO'
        required: false
        type: boolean
        default: true
  schedule:
    # Chạy tự động mỗi thứ 2 lúc 2:00 AM UTC (9:00 AM VN)
    - cron: '0 2 * * 1'

env:
  ISO_DOWNLOAD_PATH: ${{ github.workspace }}/downloads
  OUTPUT_PATH: ${{ github.workspace }}/output

jobs:
  debloat-windows-iso:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create directories
      run: |
        New-Item -ItemType Directory -Path "$env:ISO_DOWNLOAD_PATH" -Force
        New-Item -ItemType Directory -Path "$env:OUTPUT_PATH" -Force
        
    - name: Setup ISO URL and Configuration
      run: |
        $preset = "${{ github.event.inputs.preset }}"
        $customUrl = "${{ github.event.inputs.iso_url }}"
        
        # Xác định URL ISO dựa trên preset
        switch ($preset) {
          "Windows 11 Pro (Quick)" { 
            $isoUrl = "https://dn721607.ca.archive.org/0/items/windows-11-24h2-iso_202501/Win11_24H2_English_x64.iso"
            $winEdition = "Windows 11 Pro"
          }
          "Windows 11 Home (Quick)" { 
            $isoUrl = "https://dn721607.ca.archive.org/0/items/windows-11-24h2-iso_202501/Win11_24H2_English_x64.iso"
            $winEdition = "Windows 11 Home"
          }
          "Windows 10 Pro (Quick)" { 
            $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win10_22H2_English_x64v1.iso"
            $winEdition = "Windows 10 Pro"
          }
          "Windows 10 Home (Quick)" { 
            $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win10_22H2_English_x64v1.iso"
            $winEdition = "Windows 10 Home"
          }
          default { 
            $isoUrl = if ($customUrl) { $customUrl } else { "https://dn721607.ca.archive.org/0/items/windows-11-24h2-iso_202501/Win11_24H2_English_x64.iso" }
            $winEdition = "${{ github.event.inputs.win_edition }}"
          }
        }
        
        # Lưu vào environment variables
        echo "ISO_URL=$isoUrl" >> $env:GITHUB_ENV
        echo "WIN_EDITION=$winEdition" >> $env:GITHUB_ENV
        
        Write-Host "Using preset: $preset"
        Write-Host "ISO URL: $isoUrl"
        Write-Host "Windows Edition: $winEdition"
        
    - name: Download Windows ISO
      run: |
        $isoUrl = $env:ISO_URL
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        Write-Host "Downloading Windows ISO from: $isoUrl"
        
        # Fallback URLs nếu URL chính fail
        $fallbackUrls = @(
          "https://dn721607.ca.archive.org/0/items/windows-11-24h2-iso_202501/Win11_24H2_English_x64.iso",
          "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://software-download.microsoft.com/download/sg/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
        )
        
        $downloadSuccess = $false
        $ProgressPreference = 'SilentlyContinue'
        
        # Thử download từ URL chính trước
        try {
          Write-Host "Attempting download from primary URL..."
          Invoke-WebRequest -Uri $isoUrl -OutFile $isoPath -UseBasicParsing -TimeoutSec 300
          
          # Kiểm tra file size
          $fileSize = (Get-Item $isoPath).Length
          $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
          Write-Host "Downloaded file size: $fileSizeGB GB"
          
          if ($fileSize -gt 1GB) {
            $downloadSuccess = $true
            Write-Host "Download completed successfully from primary URL"
          } else {
            Write-Warning "Downloaded file is too small, trying fallback URLs..."
            Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
          }
        }
        catch {
          Write-Warning "Primary URL failed: $($_.Exception.Message)"
          Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
        }
        
        # Thử fallback URLs nếu primary URL fail
        if (-not $downloadSuccess) {
          foreach ($fallbackUrl in $fallbackUrls) {
            try {
              Write-Host "Trying fallback URL: $fallbackUrl"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile $isoPath -UseBasicParsing -TimeoutSec 300
              
              $fileSize = (Get-Item $isoPath).Length
              $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
              Write-Host "Downloaded file size: $fileSizeGB GB"
              
              if ($fileSize -gt 1GB) {
                $downloadSuccess = $true
                Write-Host "Download completed successfully from fallback URL"
                break
              } else {
                Write-Warning "Fallback file too small, trying next..."
                Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              }
            }
            catch {
              Write-Warning "Fallback URL failed: $($_.Exception.Message)"
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            }
          }
        }
        
        if (-not $downloadSuccess) {
          Write-Error "All download attempts failed. Please provide a custom ISO URL in the workflow inputs."
          Write-Host "You can get Windows ISO from: https://www.microsoft.com/en-us/software-download/windows11"
          exit 1
        }
        
        $ProgressPreference = 'Continue'
        
    - name: Verify ISO file
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        if (-not (Test-Path $isoPath)) {
          Write-Error "ISO file not found at: $isoPath"
          exit 1
        }
        
        # Kiểm tra file có phải ISO hợp lệ không
        try {
          $mountResult = Mount-DiskImage -ImagePath $isoPath -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          $mountPath = "${driveLetter}:\"
          
          # Kiểm tra các file cần thiết
          $requiredFiles = @("sources\install.wim", "sources\install.esd", "bootmgr", "bootmgr.efi")
          $missingFiles = @()
          
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $mountPath $file))) {
              $missingFiles += $file
            }
          }
          
          # Unmount
          Dismount-DiskImage -ImagePath $isoPath
          
          if ($missingFiles.Count -gt 0) {
            Write-Warning "Missing required files: $($missingFiles -join ', ')"
            Write-Host "This might be a valid ISO but missing some expected files"
          } else {
            Write-Host "ISO verification successful - all required files found"
          }
        }
        catch {
          Write-Error "Failed to verify ISO: $_"
          exit 1
        }
        
    - name: Run Windows ISO Debloater
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        $outputISO = "${{ github.event.inputs.iso_filename }}"
        $winEdition = $env:WIN_EDITION
        $preset = "${{ github.event.inputs.preset }}"
        
        # Chuẩn bị parameters cơ bản
        $params = @(
          "-noPrompt"
          "-isoPath", "`"$isoPath`""
          "-winEdition", "`"$winEdition`""
          "-outputISO", "`"$outputISO`""
        )
        
        # Xử lý preset hoặc custom options
        if ($preset -like "*Quick*") {
          # Preset tối ưu - chỉ xóa những thứ cơ bản, giữ lại các tùy chọn cho user
          $params += @(
            "-AppxRemove", "no"
            "-CapabilitiesRemove", "yes"
            "-OnedriveRemove", "yes"
            "-EDGERemove", "no"
            "-AIRemove", "no"
            "-TPMBypass", "yes"
            "-UserFoldersEnable", "yes"
            "-ESDConvert", "yes"
            "-useOscdimg", "yes"
          )
          Write-Host "Using Quick preset configuration (minimal debloat, keeping Edge, Store, AI, Defender)"
        } else {
          # Custom options - sử dụng tất cả inputs
          $params += @(
            "-AppxRemove", if ("${{ github.event.inputs.remove_msstore }}" -eq "true") { "yes" } else { "no" }
            "-CapabilitiesRemove", "yes"
            "-OnedriveRemove", "yes"
            "-EDGERemove", if ("${{ github.event.inputs.remove_edge }}" -eq "true") { "yes" } else { "no" }
            "-AIRemove", if ("${{ github.event.inputs.remove_ai }}" -eq "true") { "yes" } else { "no" }
            "-TPMBypass", if ("${{ github.event.inputs.bypass_tpm }}" -eq "true") { "yes" } else { "no" }
            "-UserFoldersEnable", "yes"
            "-ESDConvert", if ("${{ github.event.inputs.compress_iso }}" -eq "true") { "yes" } else { "no" }
            "-useOscdimg", "yes"
          )
          Write-Host "Using custom configuration with user-selected options"
        }
        
        Write-Host "Running Windows ISO Debloater..."
        Write-Host "Parameters: $($params -join ' ')"
        
        # Chạy script
        try {
          & ".\isoDebloaterScript.ps1" @params
          
          if ($LASTEXITCODE -ne 0) {
            throw "Script exited with code: $LASTEXITCODE"
          }
          
          Write-Host "Windows ISO Debloater completed successfully"
        }
        catch {
          Write-Error "Failed to run Windows ISO Debloater: $_"
          exit 1
        }
        
    - name: Check output ISO
      run: |
        $outputISO = "${{ github.event.inputs.iso_filename }}.iso"
        $outputPath = ".\$outputISO"
        
        if (-not (Test-Path $outputPath)) {
          Write-Error "Output ISO not found at: $outputPath"
          exit 1
        }
        
        $fileSize = (Get-Item $outputPath).Length
        $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
        Write-Host "Output ISO size: $fileSizeGB GB"
        
        # Di chuyển file đến output directory
        Move-Item $outputPath "$env:OUTPUT_PATH\$outputISO"
        Write-Host "Output ISO ready at: $env:OUTPUT_PATH\$outputISO"
        
    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debloated-windows-iso
        path: ${{ env.OUTPUT_PATH }}/*.iso
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: debloated-${{ github.run_number }}
        name: Windows ISO Debloated - ${{ github.run_number }}
        body: |
          ## 🚀 Windows ISO đã được xử lý tự động
          
          **📋 Thông tin:**
          - **Preset:** ${{ github.event.inputs.preset }}
          - **Phiên bản:** ${{ github.event.inputs.win_edition }}
          - **Tên file:** ${{ github.event.inputs.iso_filename }}.iso
          - **ISO gốc:** ${{ github.event.inputs.iso_url || 'Preset URL' }}
          
          **⚙️ Cấu hình xử lý:**
          - Xóa Microsoft Store: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.remove_msstore == 'true' && '✅' || '❌') || '❌ (Quick preset - giữ lại)' }}
          - Xóa Windows features: ✅
          - Xóa OneDrive: ✅
          - Xóa Microsoft Edge: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.remove_edge == 'true' && '✅' || '❌') || '❌ (Quick preset - giữ lại)' }}
          - Xóa AI Components: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.remove_ai == 'true' && '✅' || '❌') || '❌ (Quick preset - giữ lại)' }}
          - Xóa Windows Defender: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.remove_defender == 'true' && '✅' || '❌') || '❌ (Quick preset - giữ lại)' }}
          - Bypass TPM: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.bypass_tpm == 'true' && '✅' || '❌') || '✅ (Quick preset - for better compatibility)' }}
          - Bật user folders: ✅
          - Nén ISO: ${{ github.event.inputs.preset == 'Custom (Full Options)' && (github.event.inputs.compress_iso == 'true' && '✅' || '❌') || '✅ (Quick preset - for smaller file size)' }}
          
          **⚠️ Lưu ý:** File này được tạo tự động bởi GitHub Actions. Vui lòng kiểm tra kỹ trước khi sử dụng.
          
          **🔗 Hướng dẫn:** Xem [README.md](README.md) để biết cách sử dụng.
        files: ${{ env.OUTPUT_PATH }}/*.iso
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Cleanup
      if: always()
      run: |
        Write-Host "Cleaning up temporary files..."
        
        # Xóa download directory
        if (Test-Path $env:ISO_DOWNLOAD_PATH) {
          Remove-Item -Path $env:ISO_DOWNLOAD_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa output directory
        if (Test-Path $env:OUTPUT_PATH) {
          Remove-Item -Path $env:OUTPUT_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa các file tạm thời khác
        if (Test-Path ".\*.iso") {
          Remove-Item -Path ".\*.iso" -Force -ErrorAction SilentlyContinue
        }
        
        Write-Host "Cleanup completed"
