name: Windows ISO Debloater

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Select Windows Version'
        required: true
        type: choice
        options:
          - 'Windows 11'
          - 'Windows 10'
          - 'Custom (Full Options)'
        default: 'Windows 11'
      windows_build:
        description: 'Select Windows Build'
        required: true
        type: choice
        options:
          - '25H2 (Latest)'
          - '24H2'
          - '22H2'
        default: '25H2 (Latest)'
      windows_edition:
        description: 'Select Windows Edition'
        required: true
        type: choice
        options:
          - 'Pro'
          - 'Home'
          - 'Enterprise'
        default: 'Pro'
      iso_url:
        description: 'Custom ISO URL (leave empty to use preset). Get from: https://www.microsoft.com/en-us/software-download/windows11'
        required: false
        type: string
      iso_filename:
        description: 'Output ISO filename (without extension)'
        required: true
        type: string
        default: 'Windows_Debloated'
      debloat_options:
        description: 'Debloat Options (for Custom mode): edge:false,store:false,ai:false,defender:false,tpm:true,compress:true'
        required: false
        type: string
        default: 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true'
      install_office:
        description: 'Install Office automatically after debloat'
        required: false
        type: boolean
        default: false
      office_edition:
        description: 'Office Edition to install'
        required: false
        type: choice
        options:
          - 'Office 2021 Pro Plus'
          - 'Office 2019 Pro Plus'
          - 'Office 365 Pro Plus'
        default: 'Office 2021 Pro Plus'
  schedule:
    # Chạy tự động mỗi thứ 2 lúc 2:00 AM UTC (9:00 AM VN)
    - cron: '0 2 * * 1'

env:
  ISO_DOWNLOAD_PATH: ${{ github.workspace }}/downloads
  OUTPUT_PATH: ${{ github.workspace }}/output

jobs:
  debloat-windows-iso:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create directories
      run: |
        New-Item -ItemType Directory -Path "$env:ISO_DOWNLOAD_PATH" -Force
        New-Item -ItemType Directory -Path "$env:OUTPUT_PATH" -Force
        
    - name: Setup ISO URL and Configuration
      run: |
        $windowsVersion = "${{ github.event.inputs.windows_version }}"
        $windowsBuild = "${{ github.event.inputs.windows_build }}"
        $windowsEdition = "${{ github.event.inputs.windows_edition }}"
        $customUrl = "${{ github.event.inputs.iso_url }}"
        
        # Determine ISO URL based on menu selection
        if ($windowsVersion -eq "Custom (Full Options)") {
          # Custom mode - use URL from input or default
          $isoUrl = if ($customUrl) { $customUrl } else { "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d" }
          $winEdition = "${{ github.event.inputs.windows_edition }}"
        } else {
          # Quick preset mode - build from menu selections
          $winEdition = "$windowsVersion $windowsEdition"
          
          if ($windowsVersion -eq "Windows 11") {
            if ($windowsBuild -eq "25H2 (Latest)") {
              $isoUrl = "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d"
            } else {
              # 24H2 fallback
              $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso"
            }
          } elseif ($windowsVersion -eq "Windows 10") {
            # Windows 10 - always use 22H2 build
            $isoUrl = "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win10_22H2_English_x64v1.iso"
          }
        }
        
        # Lưu vào environment variables
        echo "ISO_URL=$isoUrl" >> $env:GITHUB_ENV
        echo "WIN_EDITION=$winEdition" >> $env:GITHUB_ENV
        
        Write-Host "Using preset: $preset"
        Write-Host "ISO URL: $isoUrl"
        Write-Host "Windows Edition: $winEdition"
        
    - name: Download Windows ISO
      run: |
        $isoUrl = $env:ISO_URL
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        Write-Host "Downloading Windows ISO from: $isoUrl"
        
        # Fallback URLs nếu URL chính fail - sử dụng URLs hoạt động
        $fallbackUrls = @(
          "https://software.download.prss.microsoft.com/dbazure/Win11_25H2_English_x64.iso?t=d1a5a3e8-32ba-4bf6-9655-3b1785b1d44e&P1=1761468171&P2=601&P3=2&P4=TgPmVnaRJIXKrWv3dnoKNVmTq4NCRPTaIepZB4fjx3zqeC2YX36KRov6nULxRH9uLKMNbzJ4fkcOrVe4sYSQPf2BwqD3E%2bb8fH12uNiI9qKow8WjDQiasCkH%2b69Uc66%2f9Gro5OcswLtPby99e0pB5le6PSnu2t1yMkAAjNCaJ7s6%2bUicJ39K2aEHDUjbU7hYasU6BuQUqz0xeSEptTeZLpgo7UXa2OykZ3w3s2gzaugyEojm%2btNQl8EMmiUbN1Ol3Yn5GNuDrEzlYV6WIKhw6LnxOkdzlATRI0lEiTM%2fWX3v%2fnvKAf5fsOMxVJdlQlPh2iQbUzxfe6GURVzfKxQ3pQ%3d%3d",
          "https://software-download.microsoft.com/download/pr/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://software-download.microsoft.com/download/sg/444969d5-f34g-4e03-ac9d-1f9786c69161/Win11_24H2_English_x64v1.iso",
          "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
        )
        
        $downloadSuccess = $false
        $ProgressPreference = 'SilentlyContinue'
        
        # Thử download từ URL chính trước với progress tracking
        try {
          Write-Host "Attempting download from primary URL..."
          Write-Host "URL: $isoUrl"
          
          # Sử dụng WebClient để có progress tracking
          $webClient = New-Object System.Net.WebClient
          $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
          
          # Tạo event handler cho progress với proper event registration
          $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
            $percent = $Event.SourceEventArgs.ProgressPercentage
            $bytesReceived = $Event.SourceEventArgs.BytesReceived
            $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
            
            if ($totalBytes -gt 0) {
              $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
              $totalMB = [math]::Round($totalBytes / 1MB, 2)
              Write-Host "Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
            }
          }
          
          # Bắt đầu download
          Write-Host "Starting download with progress tracking..."
          $webClient.DownloadFile($isoUrl, $isoPath)
          
          # Cleanup
          $webClient.Dispose()
          if ($eventJob) {
            Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
            Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
          }
          
          # Kiểm tra file size
          $fileSize = (Get-Item $isoPath).Length
          $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
          Write-Host "Download completed! File size: $fileSizeGB GB"
          
          if ($fileSize -gt 1GB) {
            $downloadSuccess = $true
            Write-Host "✅ Download successful from primary URL"
          } else {
            Write-Warning "Downloaded file is too small, trying fallback URLs..."
            Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
          }
        }
        catch {
          Write-Warning "Primary URL failed: $($_.Exception.Message)"
          Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
        }
        
        # Thử fallback URLs nếu primary URL fail
        if (-not $downloadSuccess) {
          foreach ($fallbackUrl in $fallbackUrls) {
            try {
              Write-Host "Trying fallback URL: $fallbackUrl"
              
              # Sử dụng WebClient cho fallback URLs cũng
              $webClient = New-Object System.Net.WebClient
              $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
              
              # Event handler cho progress với proper event registration
              $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
                $percent = $Event.SourceEventArgs.ProgressPercentage
                $bytesReceived = $Event.SourceEventArgs.BytesReceived
                $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
                
                if ($totalBytes -gt 0) {
                  $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
                  $totalMB = [math]::Round($totalBytes / 1MB, 2)
                  Write-Host "Fallback Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
                }
              }
              
              Write-Host "Starting fallback download with progress tracking..."
              $webClient.DownloadFile($fallbackUrl, $isoPath)
              
              # Cleanup
              $webClient.Dispose()
              if ($eventJob) {
                Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
                Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
              }
              
              $fileSize = (Get-Item $isoPath).Length
              $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
              Write-Host "Fallback download completed! File size: $fileSizeGB GB"
              
              if ($fileSize -gt 1GB) {
                $downloadSuccess = $true
                Write-Host "✅ Download successful from fallback URL"
                break
              } else {
                Write-Warning "Fallback file too small, trying next..."
                Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              }
            }
            catch {
              Write-Warning "Fallback URL failed: $($_.Exception.Message)"
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            }
          }
        }
        
        # Nếu tất cả WebClient attempts fail, thử Invoke-WebRequest đơn giản
        if (-not $downloadSuccess) {
          Write-Host "WebClient downloads failed, trying simple download method..."
          try {
            Write-Host "Attempting simple download from primary URL..."
            Invoke-WebRequest -Uri $isoUrl -OutFile $isoPath -UseBasicParsing -TimeoutSec 600
            
            $fileSize = (Get-Item $isoPath).Length
            $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
            Write-Host "Simple download completed! File size: $fileSizeGB GB"
            
            if ($fileSize -gt 1GB) {
              $downloadSuccess = $true
              Write-Host "✅ Download successful with simple method"
            }
          }
          catch {
            Write-Warning "Simple download also failed: $($_.Exception.Message)"
          }
        }
        
        if (-not $downloadSuccess) {
          Write-Error "All download attempts failed. Please provide a custom ISO URL in the workflow inputs."
          Write-Host "You can get Windows ISO from: https://www.microsoft.com/en-us/software-download/windows11"
          Write-Host "Or try using a different ISO URL in the 'iso_url' input field."
          exit 1
        }
        
        $ProgressPreference = 'Continue'
        
    - name: Verify ISO file
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        if (-not (Test-Path $isoPath)) {
          Write-Error "ISO file not found at: $isoPath"
          exit 1
        }
        
        # Kiểm tra file có phải ISO hợp lệ không
        try {
          $mountResult = Mount-DiskImage -ImagePath $isoPath -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          $mountPath = "${driveLetter}:\"
          
          # Kiểm tra các file cần thiết
          $requiredFiles = @("bootmgr", "bootmgr.efi")
          $missingFiles = @()
          
          # Check for either install.wim or install.esd
          $installWimPath = Join-Path $mountPath "sources\install.wim"
          $installEsdPath = Join-Path $mountPath "sources\install.esd"
          if (-not (Test-Path $installWimPath) -and -not (Test-Path $installEsdPath)) {
            $missingFiles += "sources\install.wim (or install.esd)"
          }
          
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $mountPath $file))) {
              $missingFiles += $file
            }
          }
          
          # Unmount
          Dismount-DiskImage -ImagePath $isoPath
          
          if ($missingFiles.Count -gt 0) {
            Write-Warning "Missing required files: $($missingFiles -join ', ')"
            Write-Host "This might be a valid ISO but missing some expected files"
          } else {
            Write-Host "ISO verification successful - all required files found"
          }
        }
        catch {
          Write-Error "Failed to verify ISO: $_"
          exit 1
        }
        
    - name: Run Windows ISO Debloater
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        $outputISO = "${{ github.event.inputs.iso_filename }}"
        $winEdition = $env:WIN_EDITION
        $windowsVersion = "${{ github.event.inputs.windows_version }}"
        
        # Parse debloat options for all modes (unified approach)
        if ($windowsVersion -eq "Custom (Full Options)") {
          # Custom mode - use user-provided debloat options
          $debloatOptions = "${{ github.event.inputs.debloat_options }}"
          Write-Host "Using Custom mode with user-provided debloat options: $debloatOptions"
        } else {
          # Quick preset mode - use default minimal debloat options
          $debloatOptions = "edge:false,store:false,ai:false,defender:false,tpm:true,compress:true"
          Write-Host "Using Quick preset mode with default debloat options: $debloatOptions"
        }
        
        # Parse options (format: edge:false,store:false,ai:false,defender:false,tpm:true,compress:true)
        $options = @{}
        $debloatOptions -split ',' | ForEach-Object {
          $parts = $_ -split ':'
          if ($parts.Length -eq 2) {
            $options[$parts[0]] = $parts[1]
          }
        }
        
        # Set values based on parsed options
        $edgeRemove = if ($options['edge'] -eq 'true') { "yes" } else { "no" }
        $storeRemove = if ($options['store'] -eq 'true') { "yes" } else { "no" }
        $aiRemove = if ($options['ai'] -eq 'true') { "yes" } else { "no" }
        $defenderRemove = if ($options['defender'] -eq 'true') { "yes" } else { "no" }
        $tpmBypass = if ($options['tpm'] -eq 'true') { "yes" } else { "no" }
        $esdConvert = if ($options['compress'] -eq 'true') { "yes" } else { "no" }
        
        # Display configuration
        Write-Host "=== DEBLOAT CONFIGURATION ==="
        Write-Host "Windows Version: $windowsVersion"
        Write-Host "Windows Build: $windowsBuild"
        Write-Host "Windows Edition: $windowsEdition"
        Write-Host "Remove Microsoft Edge: $edgeRemove"
        Write-Host "Remove Microsoft Store: $storeRemove"
        Write-Host "Remove AI Components: $aiRemove"
        Write-Host "Remove Windows Defender: $defenderRemove"
        Write-Host "Bypass TPM Check: $tpmBypass"
        Write-Host "Compress ISO: $esdConvert"
        Write-Host "Remove Windows Features: yes"
        Write-Host "Remove OneDrive: yes"
        Write-Host "Enable User Folders: yes"
        Write-Host "============================="
        
        Write-Host "Using unified debloat configuration for $windowsVersion"
        
        Write-Host "Running Windows ISO Debloater..."
        
        # Chạy script với parameters riêng biệt
        try {
          # Disable cursor operations for GitHub Actions environment
          $env:TERM = "dumb"
          $env:COLUMNS = "80"
          $env:LINES = "24"
          
          # Run script with output redirection to avoid cursor issues
          $process = Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `".\isoDebloaterScript.ps1`" -noPrompt -isoPath `"$isoPath`" -winEdition `"$winEdition`" -outputISO `"$outputISO`" -AppxRemove $storeRemove -CapabilitiesRemove yes -OnedriveRemove yes -EDGERemove $edgeRemove -AIRemove $aiRemove -TPMBypass $tpmBypass -UserFoldersEnable yes -ESDConvert $esdConvert -useOscdimg yes" -Wait -PassThru -RedirectStandardOutput "script_output.txt" -RedirectStandardError "script_error.txt"
          
          # Display output
          if (Test-Path "script_output.txt") {
            Write-Host "=== SCRIPT OUTPUT ==="
            Get-Content "script_output.txt" | Write-Host
            Write-Host "===================="
          }
          
          if (Test-Path "script_error.txt") {
            $errorContent = Get-Content "script_error.txt"
            if ($errorContent) {
              Write-Host "=== SCRIPT ERRORS ==="
              $errorContent | Write-Host
              Write-Host "===================="
            }
          }
          
          if ($process.ExitCode -ne 0) {
            throw "Script exited with code: $($process.ExitCode)"
          }
          
          Write-Host "Windows ISO Debloater completed successfully"
        }
        catch {
          Write-Error "Failed to run Windows ISO Debloater: $_"
          exit 1
        }
        
    - name: Install Office (Optional)
      if: github.event.inputs.install_office == 'true'
      run: |
        $installOffice = "${{ github.event.inputs.install_office }}"
        $officeEdition = "${{ github.event.inputs.office_edition }}"
        
        if ($installOffice -eq "true") {
          Write-Host "=== INSTALLING OFFICE ==="
          Write-Host "Office Edition: $officeEdition"
          Write-Host "========================="
          
          try {
            # Download and run Office Tool Plus
            Write-Host "Downloading Office Tool Plus..."
            $officeToolUrl = "https://otp.landian.vip/redirect/download/Office-Tool-with-runtime-v10.1.6.2.zip"
            $officeToolPath = "$env:ISO_DOWNLOAD_PATH\OfficeTool.zip"
            $officeToolDir = "$env:ISO_DOWNLOAD_PATH\OfficeTool"
            
            # Download Office Tool Plus
            Invoke-WebRequest -Uri $officeToolUrl -OutFile $officeToolPath -UseBasicParsing
            
            # Extract Office Tool Plus
            Expand-Archive -Path $officeToolPath -DestinationPath $officeToolDir -Force
            
            # Create Office installation configuration based on edition
            $officeConfig = switch ($officeEdition) {
              "Office 2021 Pro Plus" {
                @"
<?xml version="1.0" encoding="UTF-8"?>
<Configuration>
  <Add OfficeClientEdition="64" Channel="PerpetualVL2021">
    <Product ID="ProPlus2021Volume">
      <Language ID="en-us" />
    </Product>
  </Add>
  <Display Level="None" AcceptEULA="TRUE" />
  <Property Name="AUTOACTIVATE" Value="1" />
</Configuration>
"@
              }
              "Office 2019 Pro Plus" {
                @"
<?xml version="1.0" encoding="UTF-8"?>
<Configuration>
  <Add OfficeClientEdition="64" Channel="PerpetualVL2019">
    <Product ID="ProPlus2019Volume">
      <Language ID="en-us" />
    </Product>
  </Add>
  <Display Level="None" AcceptEULA="TRUE" />
  <Property Name="AUTOACTIVATE" Value="1" />
</Configuration>
"@
              }
              "Office 365 Pro Plus" {
                @"
<?xml version="1.0" encoding="UTF-8"?>
<Configuration>
  <Add OfficeClientEdition="64" Channel="Current">
    <Product ID="O365ProPlusRetail">
      <Language ID="en-us" />
    </Product>
  </Add>
  <Display Level="None" AcceptEULA="TRUE" />
</Configuration>
"@
              }
            }
            
            # Save configuration
            $configPath = "$officeToolDir\config.xml"
            $officeConfig | Out-File -FilePath $configPath -Encoding UTF8
            
            Write-Host "Office configuration created: $configPath"
            Write-Host "Office Edition: $officeEdition"
            
            # Download Office files using Office Tool Plus
            Write-Host "Downloading Office files..."
            $officeToolExe = Get-ChildItem -Path $officeToolDir -Filter "*.exe" | Select-Object -First 1
            if ($officeToolExe) {
              # Run Office Tool Plus to download Office
              $downloadArgs = @(
                "--download",
                "--config", $configPath,
                "--output", "$officeToolDir\OfficeFiles"
              )
              
              Write-Host "Running: $($officeToolExe.FullName) $($downloadArgs -join ' ')"
              $downloadProcess = Start-Process -FilePath $officeToolExe.FullName -ArgumentList $downloadArgs -Wait -PassThru -RedirectStandardOutput "office_download.txt" -RedirectStandardError "office_download_error.txt"
              
              if ($downloadProcess.ExitCode -eq 0) {
                Write-Host "Office files downloaded successfully"
                
                # Display download output
                if (Test-Path "office_download.txt") {
                  Write-Host "=== OFFICE DOWNLOAD OUTPUT ==="
                  Get-Content "office_download.txt" | Write-Host
                  Write-Host "=============================="
                }
              } else {
                Write-Warning "Office download failed with exit code: $($downloadProcess.ExitCode)"
                if (Test-Path "office_download_error.txt") {
                  Write-Host "=== OFFICE DOWNLOAD ERRORS ==="
                  Get-Content "office_download_error.txt" | Write-Host
                  Write-Host "============================="
                }
              }
            } else {
              Write-Warning "Office Tool Plus executable not found"
            }
            
          Write-Host "Office preparation completed. Files will be integrated into the ISO."
          
        }
        catch {
          Write-Warning "Failed to prepare Office installation: $_"
          Write-Host "Continuing without Office installation..."
        }
      } else {
        Write-Host "Office installation skipped (install_office = false)"
      }
      
    - name: Integrate Office into ISO
      if: github.event.inputs.install_office == 'true'
      run: |
        $installOffice = "${{ github.event.inputs.install_office }}"
        $officeEdition = "${{ github.event.inputs.office_edition }}"
        
        if ($installOffice -eq "true") {
          Write-Host "=== INTEGRATING OFFICE INTO ISO ==="
          Write-Host "Office Edition: $officeEdition"
          Write-Host "==================================="
          
          try {
            $officeToolDir = "$env:ISO_DOWNLOAD_PATH\OfficeTool"
            $officeFilesDir = "$officeToolDir\OfficeFiles"
            $outputISO = "${{ github.event.inputs.iso_filename }}.iso"
            
            # Check if Office files were downloaded
            if (Test-Path $officeFilesDir) {
              Write-Host "Office files found at: $officeFilesDir"
              
              # Create Office installation script for post-installation
              $officeInstallScript = @"
@echo off
echo Installing Office...
cd /d "%~dp0"
if exist "OfficeTool\OfficeTool.exe" (
    OfficeTool\OfficeTool.exe --install --config OfficeTool\config.xml
    echo Office installation completed.
) else (
    echo Office Tool Plus not found.
)
pause
"@
              
              # Save installation script
              $scriptPath = "$officeToolDir\InstallOffice.bat"
              $officeInstallScript | Out-File -FilePath $scriptPath -Encoding ASCII
              
              Write-Host "Office installation script created: $scriptPath"
              Write-Host "Office files and installation script will be included in the ISO"
              
              # Note: The actual integration into the ISO will be handled by the debloater script
              # This step prepares the Office files and installation script
              
            } else {
              Write-Warning "Office files not found. Office integration skipped."
            }
            
          }
          catch {
            Write-Warning "Failed to integrate Office into ISO: $_"
            Write-Host "Continuing without Office integration..."
          }
        } else {
          Write-Host "Office integration skipped (install_office = false)"
        }
        
    - name: Check output ISO
      run: |
        $outputISO = "${{ github.event.inputs.iso_filename }}.iso"
        $outputPath = ".\$outputISO"
        
        if (-not (Test-Path $outputPath)) {
          Write-Error "Output ISO not found at: $outputPath"
          exit 1
        }
        
        $fileSize = (Get-Item $outputPath).Length
        $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
        Write-Host "Output ISO size: $fileSizeGB GB"
        
        # Di chuyển file đến output directory
        Move-Item $outputPath "$env:OUTPUT_PATH\$outputISO"
        Write-Host "Output ISO ready at: $env:OUTPUT_PATH\$outputISO"
        
    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debloated-windows-iso
        path: ${{ env.OUTPUT_PATH }}/*.iso
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: debloated-${{ github.run_number }}
        name: Windows ISO Debloated - ${{ github.run_number }}
        body: |
          ## 🚀 Windows ISO Processed Automatically
          
          **📋 Information:**
          - **Windows Version:** ${{ github.event.inputs.windows_version }}
          - **Windows Build:** ${{ github.event.inputs.windows_build }}
          - **Windows Edition:** ${{ github.event.inputs.windows_edition }}
          - **Output File:** ${{ github.event.inputs.iso_filename }}.iso
          - **Source ISO:** ${{ github.event.inputs.iso_url || 'Preset URL' }}
          
          **⚙️ Debloat Configuration:**
          - Remove Microsoft Store: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '❌ (Quick preset - kept)' }}
          - Remove Windows Features: ✅
          - Remove OneDrive: ✅
          - Remove Microsoft Edge: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '❌ (Quick preset - kept)' }}
          - Remove AI Components: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '❌ (Quick preset - kept)' }}
          - Remove Windows Defender: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '❌ (Quick preset - kept)' }}
          - Bypass TPM: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '✅ (Quick preset - for compatibility)' }}
          - Enable User Folders: ✅
          - Compress ISO: ${{ github.event.inputs.windows_version == 'Custom (Full Options)' && 'Custom' || '✅ (Quick preset - smaller file)' }}
          
          **📝 Debloat Options Used:**
          - Quick Preset: `edge:false,store:false,ai:false,defender:false,tpm:true,compress:true`
          - Custom Mode: `${{ github.event.inputs.debloat_options }}`
          
          **📦 Office Installation:**
          - Install Office: ${{ github.event.inputs.install_office == 'true' && '✅ Yes' || '❌ No' }}
          - Office Edition: ${{ github.event.inputs.install_office == 'true' && github.event.inputs.office_edition || 'N/A' }}
          
          **📝 Debloat Options Format (for Custom mode):**
          ```
          edge:true/false,store:true/false,ai:true/false,defender:true/false,tpm:true/false,compress:true/false
          ```
          
          **⚠️ Note:** This file was generated automatically by GitHub Actions. Please verify before use.
          
          **🔗 Guide:** See [README.md](README.md) for usage instructions.
        files: ${{ env.OUTPUT_PATH }}/*.iso
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Cleanup
      if: always()
      run: |
        Write-Host "Cleaning up temporary files..."
        
        # Xóa download directory
        if (Test-Path $env:ISO_DOWNLOAD_PATH) {
          Remove-Item -Path $env:ISO_DOWNLOAD_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa output directory
        if (Test-Path $env:OUTPUT_PATH) {
          Remove-Item -Path $env:OUTPUT_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa các file tạm thời khác
        if (Test-Path ".\*.iso") {
          Remove-Item -Path ".\*.iso" -Force -ErrorAction SilentlyContinue
        }
        
        Write-Host "Cleanup completed"
