name: Windows ISO Debloater

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Windows ISO URL (required). Get from: https://www.microsoft.com/en-us/software-download/windows11 or https://archive.org/download/windows-11-25h2-iso/'
        required: true
        type: string
      windows_edition:
        description: 'Windows Edition'
        required: true
        type: choice
        options:
          - 'Pro'
          - 'Home'
          - 'Enterprise'
        default: 'Pro'
      iso_filename:
        description: 'Output ISO filename (without extension)'
        required: true
        type: string
        default: 'Windows_Debloated'
      debloat_options:
        description: 'Debloat Options: edge:false,store:false,ai:false,defender:false,tpm:true,compress:true'
        required: false
        type: string
        default: 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true'
  schedule:
    # Chạy tự động mỗi thứ 2 lúc 2:00 AM UTC (9:00 AM VN)
    - cron: '0 2 * * 1'

env:
  ISO_DOWNLOAD_PATH: ${{ github.workspace }}/downloads
  OUTPUT_PATH: ${{ github.workspace }}/output

jobs:
  debloat-windows-iso:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create directories
      run: |
        New-Item -ItemType Directory -Path "$env:ISO_DOWNLOAD_PATH" -Force
        New-Item -ItemType Directory -Path "$env:OUTPUT_PATH" -Force
        
    - name: Download Windows ISO
      run: |
        $isoUrl = "${{ github.event.inputs.iso_url }}"
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        Write-Host "Downloading Windows ISO from: $isoUrl"
        
        # Fallback URLs nếu URL chính fail - sử dụng URLs hoạt động từ Archive.org và mirrors
        $fallbackUrls = @(
          "https://archive.org/download/windows-11-25h2-iso/Win11_25H2_English_x64.iso",
          "https://archive.org/download/windows-11-24h2-iso/Win11_24H2_English_x64.iso",
          "https://archive.org/download/windows-11-22h2-iso/Win11_22H2_English_x64.iso",
          "https://archive.org/download/windows-10-22h2-iso/Win10_22H2_English_x64.iso",
          "https://archive.org/download/windows-10-21h2-iso/Win10_21H2_English_x64.iso"
        )
        
        $downloadSuccess = $false
        $ProgressPreference = 'SilentlyContinue'
        
        # Thử download từ URL chính trước với progress tracking
        try {
          Write-Host "Attempting download from primary URL..."
          Write-Host "URL: $isoUrl"
          
          # Sử dụng WebClient để có progress tracking với headers tốt hơn
          $webClient = New-Object System.Net.WebClient
          $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          $webClient.Headers.Add("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8")
          $webClient.Headers.Add("Accept-Language", "en-US,en;q=0.5")
          $webClient.Headers.Add("Accept-Encoding", "gzip, deflate")
          $webClient.Headers.Add("Connection", "keep-alive")
          $webClient.Headers.Add("Upgrade-Insecure-Requests", "1")
          
          # Tạo event handler cho progress với proper event registration
          $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
            $percent = $Event.SourceEventArgs.ProgressPercentage
            $bytesReceived = $Event.SourceEventArgs.BytesReceived
            $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
            
            if ($totalBytes -gt 0) {
              $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
              $totalMB = [math]::Round($totalBytes / 1MB, 2)
              Write-Host "Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
            }
          }
          
          # Bắt đầu download
          Write-Host "Starting download with progress tracking..."
          $webClient.DownloadFile($isoUrl, $isoPath)
          
          # Cleanup
          $webClient.Dispose()
          if ($eventJob) {
            Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
            Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
          }
          
          # Kiểm tra file size
          $fileSize = (Get-Item $isoPath).Length
          $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
          Write-Host "Download completed! File size: $fileSizeGB GB"
          
          if ($fileSize -gt 1GB) {
            $downloadSuccess = $true
            Write-Host "✅ Download successful from primary URL"
          } else {
            Write-Warning "Downloaded file is too small, trying fallback URLs..."
            Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
          }
        }
        catch {
          Write-Warning "Primary URL failed: $($_.Exception.Message)"
          Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
        }
        
        # Thử fallback URLs nếu primary URL fail
        if (-not $downloadSuccess) {
          foreach ($fallbackUrl in $fallbackUrls) {
            try {
              Write-Host "Trying fallback URL: $fallbackUrl"
              
              # Sử dụng WebClient cho fallback URLs với headers tốt hơn
              $webClient = New-Object System.Net.WebClient
              $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              $webClient.Headers.Add("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8")
              $webClient.Headers.Add("Accept-Language", "en-US,en;q=0.5")
              $webClient.Headers.Add("Accept-Encoding", "gzip, deflate")
              $webClient.Headers.Add("Connection", "keep-alive")
              $webClient.Headers.Add("Upgrade-Insecure-Requests", "1")
              
              # Event handler cho progress với proper event registration
              $eventJob = Register-ObjectEvent -InputObject $webClient -EventName DownloadProgressChanged -Action {
                $percent = $Event.SourceEventArgs.ProgressPercentage
                $bytesReceived = $Event.SourceEventArgs.BytesReceived
                $totalBytes = $Event.SourceEventArgs.TotalBytesToReceive
                
                if ($totalBytes -gt 0) {
                  $receivedMB = [math]::Round($bytesReceived / 1MB, 2)
                  $totalMB = [math]::Round($totalBytes / 1MB, 2)
                  Write-Host "Fallback Download Progress: $percent% ($receivedMB MB / $totalMB MB)"
                }
              }
              
              Write-Host "Starting fallback download with progress tracking..."
              $webClient.DownloadFile($fallbackUrl, $isoPath)
              
              # Cleanup
              $webClient.Dispose()
              if ($eventJob) {
                Unregister-Event -SourceIdentifier $eventJob.Name -ErrorAction SilentlyContinue
                Remove-Job -Job $eventJob -ErrorAction SilentlyContinue
              }
              
              $fileSize = (Get-Item $isoPath).Length
              $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
              Write-Host "Fallback download completed! File size: $fileSizeGB GB"
              
              if ($fileSize -gt 1GB) {
                $downloadSuccess = $true
                Write-Host "✅ Download successful from fallback URL"
                break
              } else {
                Write-Warning "Fallback file too small, trying next..."
                Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              }
            }
            catch {
              Write-Warning "Fallback URL failed: $($_.Exception.Message)"
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            }
          }
        }
        
        # Nếu tất cả WebClient attempts fail, thử Invoke-WebRequest đơn giản
        if (-not $downloadSuccess) {
          Write-Host "WebClient downloads failed, trying simple download method..."
          try {
            Write-Host "Attempting simple download from primary URL..."
            $headers = @{
              'User-Agent' = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              'Accept' = 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
              'Accept-Language' = 'en-US,en;q=0.5'
              'Accept-Encoding' = 'gzip, deflate'
              'Connection' = 'keep-alive'
              'Upgrade-Insecure-Requests' = '1'
            }
            Invoke-WebRequest -Uri $isoUrl -OutFile $isoPath -UseBasicParsing -TimeoutSec 600 -Headers $headers
            
            $fileSize = (Get-Item $isoPath).Length
            $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
            Write-Host "Simple download completed! File size: $fileSizeGB GB"
            
            if ($fileSize -gt 1GB) {
              $downloadSuccess = $true
              Write-Host "✅ Download successful with simple method"
            }
          }
          catch {
            Write-Warning "Simple download also failed: $($_.Exception.Message)"
          }
        }
        
        # Nếu tất cả PowerShell methods fail, thử curl
        if (-not $downloadSuccess) {
          Write-Host "PowerShell downloads failed, trying curl method..."
          try {
            Write-Host "Attempting curl download from primary URL..."
            curl -L -o $isoPath -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" $isoUrl
            
            $fileSize = (Get-Item $isoPath).Length
            $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
            Write-Host "Curl download completed! File size: $fileSizeGB GB"
            
            if ($fileSize -gt 1GB) {
              $downloadSuccess = $true
              Write-Host "✅ Download successful with curl method"
            }
          }
          catch {
            Write-Warning "Curl download also failed: $($_.Exception.Message)"
          }
        }
        
        if (-not $downloadSuccess) {
          Write-Error "All download attempts failed. Please provide a custom ISO URL in the workflow inputs."
          Write-Host "You can get Windows ISO from: https://www.microsoft.com/en-us/software-download/windows11"
          Write-Host "Or try using a different ISO URL in the 'iso_url' input field."
          Write-Host "Alternative sources:"
          Write-Host "- Archive.org: https://archive.org/download/windows-11-25h2-iso/"
          Write-Host "- Archive.org: https://archive.org/download/windows-11-24h2-iso/"
          exit 1
        }
        
        $ProgressPreference = 'Continue'
        
    - name: Verify ISO file
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        
        if (-not (Test-Path $isoPath)) {
          Write-Error "ISO file not found at: $isoPath"
          exit 1
        }
        
        # Kiểm tra file có phải ISO hợp lệ không
        try {
          $mountResult = Mount-DiskImage -ImagePath $isoPath -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          $mountPath = "${driveLetter}:\"
          
          # Kiểm tra các file cần thiết
          $requiredFiles = @("bootmgr", "bootmgr.efi")
          $missingFiles = @()
          
          # Check for either install.wim or install.esd
          $installWimPath = Join-Path $mountPath "sources\install.wim"
          $installEsdPath = Join-Path $mountPath "sources\install.esd"
          if (-not (Test-Path $installWimPath) -and -not (Test-Path $installEsdPath)) {
            $missingFiles += "sources\install.wim (or install.esd)"
          }
          
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $mountPath $file))) {
              $missingFiles += $file
            }
          }
          
          # Unmount
          Dismount-DiskImage -ImagePath $isoPath
          
          if ($missingFiles.Count -gt 0) {
            Write-Warning "Missing required files: $($missingFiles -join ', ')"
            Write-Host "This might be a valid ISO but missing some expected files"
          } else {
            Write-Host "ISO verification successful - all required files found"
          }
        }
        catch {
          Write-Error "Failed to verify ISO: $_"
          exit 1
        }
        
    - name: Run Windows ISO Debloater
      run: |
        $isoPath = "$env:ISO_DOWNLOAD_PATH\windows.iso"
        $outputISO = "${{ github.event.inputs.iso_filename }}"
        $winEdition = "${{ github.event.inputs.windows_edition }}"
        
        # Use debloat options from input
        $debloatOptions = "${{ github.event.inputs.debloat_options }}"
        Write-Host "Using debloat options: $debloatOptions"
        
        # Parse options (format: edge:false,store:false,ai:false,defender:false,tpm:true,compress:true)
        $options = @{}
        $debloatOptions -split ',' | ForEach-Object {
          $parts = $_ -split ':'
          if ($parts.Length -eq 2) {
            $options[$parts[0]] = $parts[1]
          }
        }
        
        # Set values based on parsed options
        $edgeRemove = if ($options['edge'] -eq 'true') { "yes" } else { "no" }
        $storeRemove = if ($options['store'] -eq 'true') { "yes" } else { "no" }
        $aiRemove = if ($options['ai'] -eq 'true') { "yes" } else { "no" }
        $defenderRemove = if ($options['defender'] -eq 'true') { "yes" } else { "no" }
        $tpmBypass = if ($options['tpm'] -eq 'true') { "yes" } else { "no" }
        $esdConvert = if ($options['compress'] -eq 'true') { "yes" } else { "no" }
        
        # Display configuration
        Write-Host "=== DEBLOAT CONFIGURATION ==="
        Write-Host "Windows Edition: $winEdition"
        Write-Host "Remove Microsoft Edge: $edgeRemove"
        Write-Host "Remove Microsoft Store: $storeRemove"
        Write-Host "Remove AI Components: $aiRemove"
        Write-Host "Remove Windows Defender: $defenderRemove"
        Write-Host "Bypass TPM Check: $tpmBypass"
        Write-Host "Compress ISO: $esdConvert"
        Write-Host "Remove Windows Features: yes"
        Write-Host "Remove OneDrive: yes"
        Write-Host "Enable User Folders: yes"
        Write-Host "============================="
        
        Write-Host "Running Windows ISO Debloater..."
        
        # Chạy script với parameters riêng biệt
        try {
          # Disable cursor operations for GitHub Actions environment
          $env:TERM = "dumb"
          $env:COLUMNS = "80"
          $env:LINES = "24"
          
          # Run script with output redirection to avoid cursor issues
          $process = Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `".\isoDebloaterScript.ps1`" -noPrompt -isoPath `"$isoPath`" -winEdition `"$winEdition`" -outputISO `"$outputISO`" -AppxRemove $storeRemove -CapabilitiesRemove yes -OnedriveRemove yes -EDGERemove $edgeRemove -AIRemove $aiRemove -TPMBypass $tpmBypass -UserFoldersEnable yes -ESDConvert $esdConvert -useOscdimg yes" -Wait -PassThru -RedirectStandardOutput "script_output.txt" -RedirectStandardError "script_error.txt"
          
          # Display output
          if (Test-Path "script_output.txt") {
            Write-Host "=== SCRIPT OUTPUT ==="
            Get-Content "script_output.txt" | Write-Host
            Write-Host "===================="
          }
          
          if (Test-Path "script_error.txt") {
            $errorContent = Get-Content "script_error.txt"
            if ($errorContent) {
              Write-Host "=== SCRIPT ERRORS ==="
              $errorContent | Write-Host
              Write-Host "===================="
            }
          }
          
          if ($process.ExitCode -ne 0) {
            throw "Script exited with code: $($process.ExitCode)"
          }
          
          Write-Host "Windows ISO Debloater completed successfully"
        }
        catch {
          Write-Error "Failed to run Windows ISO Debloater: $_"
          exit 1
        }
        
    - name: Check output ISO
      run: |
        $outputISO = "${{ github.event.inputs.iso_filename }}.iso"
        $outputPath = ".\$outputISO"
        
        if (-not (Test-Path $outputPath)) {
          Write-Error "Output ISO not found at: $outputPath"
          exit 1
        }
        
        $fileSize = (Get-Item $outputPath).Length
        $fileSizeGB = [math]::Round($fileSize / 1GB, 2)
        Write-Host "Output ISO size: $fileSizeGB GB"
        
        # Di chuyển file đến output directory
        Move-Item $outputPath "$env:OUTPUT_PATH\$outputISO"
        Write-Host "Output ISO ready at: $env:OUTPUT_PATH\$outputISO"
        
    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debloated-windows-iso
        path: ${{ env.OUTPUT_PATH }}/*.iso
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: debloated-${{ github.run_number }}
        name: Windows ISO Debloated - ${{ github.run_number }}
        body: |
          ## 🚀 Windows ISO Processed Automatically
          
          **📋 Information:**
          - **Windows Edition:** ${{ github.event.inputs.windows_edition }}
          - **Output File:** ${{ github.event.inputs.iso_filename }}.iso
          - **Source ISO:** ${{ github.event.inputs.iso_url }}
          
          **⚙️ Debloat Configuration:**
          - Remove Microsoft Store: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '❌ (kept)' || 'Custom' }}
          - Remove Windows Features: ✅
          - Remove OneDrive: ✅
          - Remove Microsoft Edge: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '❌ (kept)' || 'Custom' }}
          - Remove AI Components: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '❌ (kept)' || 'Custom' }}
          - Remove Windows Defender: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '❌ (kept)' || 'Custom' }}
          - Bypass TPM: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '✅ (for compatibility)' || 'Custom' }}
          - Enable User Folders: ✅
          - Compress ISO: ${{ github.event.inputs.debloat_options == 'edge:false,store:false,ai:false,defender:false,tpm:true,compress:true' && '✅ (smaller file)' || 'Custom' }}
          
          **📝 Debloat Options Used:**
          `${{ github.event.inputs.debloat_options }}`
          
          **📝 Debloat Options Format (for Custom mode):**
          ```
          edge:true/false,store:true/false,ai:true/false,defender:true/false,tpm:true/false,compress:true/false
          ```
          
          **⚠️ Note:** This file was generated automatically by GitHub Actions. Please verify before use.
          
          **🔗 Guide:** See [README.md](README.md) for usage instructions.
        files: ${{ env.OUTPUT_PATH }}/*.iso
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Cleanup
      if: always()
      run: |
        Write-Host "Cleaning up temporary files..."
        
        # Xóa download directory
        if (Test-Path $env:ISO_DOWNLOAD_PATH) {
          Remove-Item -Path $env:ISO_DOWNLOAD_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa output directory
        if (Test-Path $env:OUTPUT_PATH) {
          Remove-Item -Path $env:OUTPUT_PATH -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # Xóa các file tạm thời khác
        if (Test-Path ".\*.iso") {
          Remove-Item -Path ".\*.iso" -Force -ErrorAction SilentlyContinue
        }
        
        Write-Host "Cleanup completed"
